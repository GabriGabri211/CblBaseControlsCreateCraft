<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobblestone Labs base manager</title>
    <link rel="icon" type="image/png" href="cobble.png">
</head>
<body>
  <div class="app">
    <header>
      <h1>Webhook Messenger</h1>
      <span id="status">Disconnected</span>
    </header>

    <main id="messages">
      <div class="empty">
        No messages yet
      </div>
    </main>

    <form id="messageForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        required
      >

      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
